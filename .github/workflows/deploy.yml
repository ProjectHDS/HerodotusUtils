# A deployment template that works out of the box
# It supports these objectives:
# - Deploy to Maven (Build Job) [Secrets: MAVEN_USER, MAVEN_PASS]
# - Deploy to CurseForge (Upload Job) [Secrets: CURSEFORGE_TOKEN]
# - Deploy to Modrinth (Upload Job) [Secrets: MODRINTH_TOKEN]

name: Deploy

on:
    workflow_dispatch:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]+"

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Grant Execute Permission for gradlew
              run: chmod +x gradlew

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  java-version: |
                      8
                      11
                      17
                      21
                  distribution: "zulu"
                  cache: gradle
                  cache-dependency-path: |
                    libs/*

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Read gradle.properties
              uses: BrycensRanch/read-properties-action@v1.0.4
              id: properties
              with:
                  file: gradle.properties
                  all: true

            - name: Build
              run: ./gradlew build

            - name: Publish to Maven
              if: steps.properties.outputs.publish_to_maven == 'true' && steps.properties.outputs.publish_to_local_maven == 'true'
              run: ./gradlew publish -P${{ steps.properties.outputs.maven_name }}Username=${{ secrets.MAVEN_USER }} -P${{ steps.properties.outputs.maven_name }}Password=${{ secrets.MAVEN_PASS }}

            - name: Publish to CurseForge
              if: steps.properties.outputs.publish_to_curseforge == 'true'
              run: ./gradlew curseforge
              env:
                  CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

            - name: Publish to Modrinth
              if: steps.properties.outputs.publish_to_modrinth == 'true'
              uses: cloudnode-pro/modrinth-publish@v2
              with:
                token: ${{ secrets.MODRINTH_TOKEN }}
                project: ${{ steps.properties.outputs.modrinth_project_id }}
                version: ${{ steps.properties.outputs.mod_version }}
                loaders: '["forge"]'
                game-versions: '["1.12.2"]'
                files: build/libs/hdsutils-${{ steps.properties.outputs.mod_version }}.jar

            - uses: ncipollo/release-action@v1.16.0
              with:
                  artifacts: "build/libs/*"
                  generateReleaseNotes: true
